# Home Assistant app manifest for "Seestar for Home Assistant".
#
# The seestar_bridge telemetry publisher: it reads a seestar_alp Alpaca driver
# (the seestar_alp add-on, found automatically, or your own via alpaca_host) and
# publishes MQTT discovery. Option keys match seestar_bridge.settings.load_settings
# verbatim. The Supervisor reads the image from GHCR ({arch} is substituted per
# architecture).
name: Seestar for Home Assistant
slug: seestar
version: "1.2.0"
description: >-
  Live Seestar imaging telemetry, a stacked-image preview and controls in Home
  Assistant via MQTT discovery. Pairs with the seestar_alp add-on.
url: https://github.com/jaxzin/ha-seestar
arch:
  - aarch64
  - amd64

# The image has its own init system (s6-overlay v3), so the Docker default init
# must be disabled (required for s6 v3 or the app won't start).
init: false

# bashio reads the add-on config + the mqtt service via the Supervisor API; the
# bridge reads the add-on list (/supervisor/info) to find the seestar_alp add-on.
hassio_api: true

# Resolve the broker from the Supervisor MQTT service when mqtt_host is blank.
services:
  - mqtt:want

# Prebuilt multi-arch image; {arch} is substituted by the Supervisor.
image: ghcr.io/jaxzin/ha-seestar-{arch}

options:
  alpaca_host: ""
  alpaca_webui_port: 5432
  imaging_port: 7556
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_ssl: false
  discovery_prefix: homeassistant
  event_poll_sec: 10
  state_poll_sec: 30
  preview_max_px: 1280
  log_level: info

schema:
  # Blank = find the seestar_alp add-on automatically; else host:port of your own.
  alpaca_host: str?
  # The seestar_alp web-UI port the preview address is read from (/config.json).
  alpaca_webui_port: port
  # seestar_alp's imaging server on the Alpaca host (the live /vid camera).
  imaging_port: port
  # MQTT overrides; blank/0 = use the Supervisor (Mosquitto add-on) service.
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_ssl: bool
  discovery_prefix: str
  event_poll_sec: int(1,3600)
  state_poll_sec: int(1,3600)
  preview_max_px: int(256,4096)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
