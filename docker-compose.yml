# Seestar for Home Assistant — Docker Compose path (for installs WITHOUT the HA
# Supervisor: Home Assistant Container, Home Assistant Core, or a dedicated box
# such as a separate Raspberry Pi).
#
# Two services: the seestar_alp Alpaca driver, built from seestar_alp's own
# docker/Dockerfile at the same pinned tag the seestar_alp add-on uses, and the
# seestar_bridge telemetry publisher from this app's GHCR image. The bridge
# image's ENTRYPOINT is s6-overlay's /init, whose bashio oneshot resolves MQTT via
# the Supervisor API, which does NOT exist here, so the bridge overrides
# `entrypoint: []` and runs directly, configured through environment + mounted
# files instead.
#
#   docker compose up -d --build    # build seestar_alp, pull the bridge, start
#   docker compose logs -f bridge   # watch MQTT discovery + connection
#   docker compose down             # stop
#
# ---------------------------------------------------------------------------
# REQUIRED CONFIG FILES — create these BEFORE the first `docker compose up`:
#
#     cp examples/config.toml.sample   ./config.toml
#     cp examples/options.json.sample  ./options.json
#     cp examples/env.sample           ./.env        # then edit MQTT_* + ARCH
#
#   These are bind-mount sources (below). A bind-mount whose source path is
#   MISSING is created by Docker as an empty DIRECTORY, which silently breaks
#   startup (seestar_alp/the bridge try to read a directory as a file). Create
#   the files first so the mounts land on real files.
#
# ---------------------------------------------------------------------------
# REQUIRED CONFIG (no Supervisor = nothing is auto-resolved):
#
#   * MQTT — the broker MUST be given explicitly to the bridge via the
#     MQTT_HOST / MQTT_PORT / MQTT_USERNAME / MQTT_PASSWORD / MQTT_SSL environment
#     variables (set in the env block below, or in a .env file next to this one —
#     see examples/env.sample).
#   * Scope(s) — the bridge enumerates scopes from seestar_alp, so seestar_alp
#     must know them: the config.toml bind-mount below.
#
#   Only MQTT_* are environment variables; everything else lives in options.json
#   (the bridge reads alpaca_host/alpaca_webui_port and the tuning knobs from
#   /data/options.json only — see examples/options.json.sample).
#
#   Already run seestar_alp elsewhere? Delete the `seestar_alp` service (and the
#   bridge's depends_on) and set alpaca_host to "<your-seestar_alp-host>:5555" in
#   options.json.
# ---------------------------------------------------------------------------

services:
  seestar_alp:
    build:
      context: https://github.com/jaxzin/seestar_alp.git#deploy-2026.11.03
      dockerfile: docker/Dockerfile
      args:
        ASTRO_PLATFORM: ALPACA
    image: seestar_alp:deploy-2026.11.03
    container_name: seestar_alp
    restart: unless-stopped
    networks:
      - seestar-net
    ports:
      - "5432:5432"   # SSC web UI
      - "7556:7556"   # imaging API
      # Alpaca 5555 stays internal to seestar-net; the bridge reaches it by container DNS.
    volumes:
      # seestar_alp reads its scopes + ports from this file. Copy
      # examples/config.toml.sample, fill in your scope name(s) + LAN IP(s), and
      # keep [network] ip_address='0.0.0.0' so the bridge can reach Alpaca by DNS.
      - ./config.toml:/home/seestar/seestar_alp/device/config.toml:ro
      # Firmware >= 7.18 interop key (optional; see examples/config.toml.sample):
      # - ./secrets:/home/seestar/seestar_alp/secrets:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- The telemetry bridge ----------------------------------------------------
  bridge:
    image: ghcr.io/jaxzin/ha-seestar-${ARCH:-amd64}
    # To build locally instead of pulling:
    # build:
    #   context: ./seestar
    #   args:
    #     BUILD_FROM: ghcr.io/home-assistant/${ARCH:-amd64}-base-debian:trixie-2026.06.1
    container_name: seestar_bridge
    restart: unless-stopped
    depends_on:
      - seestar_alp           # remove this line if you deleted the seestar_alp service
    networks:
      - seestar-net
    environment:
      # Bridge runtime config. The s6 run script normally sets PYTHONPATH; do the
      # same here since we launch python directly.
      PYTHONPATH: /app/bridge
      # MQTT is the ONLY config the bridge takes from the environment (everything
      # else — alpaca_host, the tuning knobs — comes from options.json below).
      # REQUIRED: no Supervisor service to fall back on. Move the secrets into a
      # .env file beside this compose file if you prefer (see examples/env.sample).
      MQTT_HOST: ${MQTT_HOST:?set MQTT_HOST (your broker) in the environment or a .env file}
      # Set MQTT_PORT=8883 when MQTT_SSL=true (TLS listener); 1883 is the plaintext default.
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_SSL: ${MQTT_SSL:-false}
    # Replace the image's ENTRYPOINT (s6-overlay's /init) with nothing so the
    # `command:` runs the bridge directly, bypassing the s6/bashio init that
    # would otherwise try to resolve MQTT against a nonexistent Supervisor.
    entrypoint: []
    command: ["python3", "-m", "seestar_bridge.main"]
    volumes:
      # The bridge reads its non-MQTT options from /data/options.json (the same
      # file the Supervisor would mount): alpaca_host + the tuning knobs — set
      # them in options.json, NOT as env vars. See examples/options.json.sample.
      - ./options.json:/data/options.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  seestar-net:
    name: seestar-net
